# Local config for the Lüneburg web store.
# Link a hosted project with `supabase link`, then `supabase db push`.
# Do not put secrets in this file.

project_id = "hnhmfnundobuarvfbaae"

# Guests send the anon key as the bearer. A signed-in access token is optional
# and, when it is a real user, the order is attached to that account.
[functions.create-checkout]
verify_jwt = true

[functions.yoco-webhook]
verify_jwt = false
